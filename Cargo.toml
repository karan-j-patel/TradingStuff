[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

# Versions pinned to the latest resolved from crates.io on 2026-08-07.
# Refresh with `cargo update` plus a bump here rather than letting these drift.
[workspace.dependencies]
anyhow = "1.0.104"
# Arrow and Parquet move in lockstep and share a major, so they are pinned
# together. `duckdb` is deliberately absent from this stack: it pins arrow ^58,
# two arrow majors do not unify, and DuckDB is SQL-only here by standing rule.
# parquet's default features already include zstd, so no extra flag is needed.
arrow = "59.2.0"
parquet = "59.2.0"
clap = { version = "4.6.6", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
# `maths` supplies `sqrt` and `checked_ln` on Decimal. The trial-count threshold
# needs both and the alternative was routing them through f64, which this
# project does not do for numbers that decide anything.
rust_decimal = { version = "1.42.1", features = [
    "maths",
    "serde-with-str",
    "serde-with-arbitrary-precision",
] }
serde = { version = "1.0.229", features = ["derive"] }
# `arbitrary_precision` keeps a JSON number as the exact text the vendor sent
# instead of routing it through f64 on the way into `serde_json::Value`. The
# Sharadar decoder parses that text straight into `Decimal`, which is the only
# way an 18-significant-digit price survives the trip. It is a workspace-level
# feature because cargo unifies features across the graph, so enabling it in one
# crate enables it everywhere and pretending otherwise would hide the blast
# radius. The trial log in `rigor` is unaffected: every field it serialises is a
# string or null, so it has no numeric token for this feature to touch.
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
# Blocking by design. Nothing in this system has a concurrency requirement that
# justifies async, and an HTTP client is the place that assumption gets tested
# first. Default features are `rustls` and `gzip`, which is TLS plus response
# compression and nothing else. `json` is deliberately left off: the Sharadar
# decoder needs the raw numeric token rather than a parsed value, so it drives
# serde_json itself.
ureq = "3.4.0"
